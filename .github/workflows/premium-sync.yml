name: Sync premium (Stripe)

on:
  schedule:
    - cron: "25 * * * *" # toutes les heures : activation premium < 1 h après paiement
  workflow_dispatch:

jobs:
  sync:
    # Dormant tant que le palier payant n'est pas lancé (variable de repo).
    if: vars.PREMIUM_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
        run: python -m scripts.stripe_sync

name: Deploy front seul

# Publie le site avec les DONNÉES DÉJÀ EN PROD : correction de front en ~1 min,
# sans collecte ni newsletter. Pour les données fraîches : "Scrape & Deploy".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembler le site avec les données de prod
        run: |
          mkdir -p _site
          cp -r site/* _site/
          python3 scripts/fetch_prod_data.py _site/data
          python3 -m scripts.seo --data _site/data --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Découverte d'entreprises (Common Crawl)

# Moissonne les slugs d'entreprises sur les domaines ATS via les index Common
# Crawl, sonde chaque slug (gardé si ≥1 offre localisée en France) et commite
# les ajouts dans companies.json. L'index CC est capricieux : les échecs d'un
# ATS n'empêchent pas les autres.
on:
  schedule:
    - cron: "0 3 3 * *" # le 3 du mois à 3h UTC
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages d'index CC par ATS"
        default: "3"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Moisson et sondage
        run: |
          PAGES="${{ inputs.pages || '3' }}"
          for ats in lever ashby greenhouse smartrecruiters; do
            python -m scripts.discover --cc "$ats" --cc-max-pages "$PAGES" || true
            sleep 60
          done

      - name: Commiter les ajouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle entreprise."
          else
            git commit -m "Découverte : nouvelles entreprises FR via Common Crawl"
            git push
          fi

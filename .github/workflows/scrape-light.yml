name: Scrape léger (horaire)

# Run incrémental : delta France Travail / WTTJ / Adzuna des 2 dernières heures,
# fusionné avec les données déjà en prod. Les boards ATS restent sur les
# 3 collectes complètes. Latence des nouvelles offres : ~1 h au lieu de ~4 h.
on:
  schedule:
    - cron: "0 0-4,6-10,12-16,18-23 * * *" # toutes les heures sauf les collectes complètes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaurer le cache de géocodage
        uses: actions/cache@v4
        with:
          path: data/geo_cache.json
          key: geo-cache-${{ github.run_id }}
          restore-keys: geo-cache-

      - name: Récupérer les données de prod
        run: python scripts/fetch_prod_data.py data

      - name: Delta incrémental
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          EMBARGO_MINUTES: "60"
        run: python -m scripts.build --light

      - name: Vérifier le volume minimal
        run: |
          python - <<'EOF'
          import json, sys
          manifest = json.load(open("data/manifest.json"))
          if manifest["total"] < 2000:
              sys.exit(f"Volume anormalement bas ({manifest['total']}), déploiement annulé.")
          print(f"{manifest['total']} offres")
          EOF

      - name: Newsletter premium (avant-première)
        if: vars.PREMIUM_ENABLED == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: tech-jobz
        run: python -m scripts.newsletter --tier premium

      - name: Newsletter gratuite (à la publication)
        if: vars.PREMIUM_ENABLED == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: tech-jobz
        run: python -m scripts.newsletter --tier free

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/manifest.json data/analytics.json data/history.json data/seen_ids.json data/*.json.gz _site/data/

      - name: Pages SEO (offres, segments, sitemap)
        run: python -m scripts.seo --data data --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

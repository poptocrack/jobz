name: Scrape & Deploy

on:
  schedule:
    - cron: "0 5 * * *"  # ~06h/07h Paris selon la saison
    - cron: "0 11 * * *" # ~12h/13h Paris
    - cron: "0 17 * * *" # ~18h/19h Paris
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurer le cache de géocodage
        uses: actions/cache@v4
        with:
          path: data/geo_cache.json
          key: geo-cache-${{ github.run_id }}
          restore-keys: geo-cache-

      - name: Construire les données
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m scripts.build

      # --- Newsletter ---
      # Tant que PREMIUM_ENABLED n'est pas 'true' : tout le monde reçoit les
      # alertes avant la publication (offre de lancement). Une fois activé :
      # premium d'abord, gratuits au moment de la publication.
      - name: Sync premium (Stripe)
        if: vars.PREMIUM_ENABLED == 'true'
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
        run: python -m scripts.stripe_sync

      - name: Newsletter (tous les abonnés, avant-première)
        if: vars.PREMIUM_ENABLED != 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: tech-jobz
        run: python -m scripts.newsletter --tier all

      - name: Newsletter premium (avant-première)
        if: vars.PREMIUM_ENABLED == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: tech-jobz
        run: python -m scripts.newsletter --tier premium

      - name: Vérifier le volume minimal
        run: |
          python - <<'EOF'
          import json, sys
          manifest = json.load(open("data/manifest.json"))
          total = manifest["total"]
          print(f"{total} offres — sources: {manifest['stats']['par_source']}")
          if total < 2000:
              sys.exit(f"Volume anormalement bas ({total} offres), déploiement annulé.")
          EOF

      # L'avant-première : les emails sont partis, le site attend 1 h.
      # Sur un run manuel (workflow_dispatch, déploiement de code), pas d'attente.
      - name: Retenue avant publication
        if: github.event_name == 'schedule' && vars.DEPLOY_DELAY_SECONDS != '' && vars.DEPLOY_DELAY_SECONDS != '0'
        run: sleep ${{ vars.DEPLOY_DELAY_SECONDS }}

      - name: Newsletter gratuite (à la publication)
        if: github.event_name == 'schedule' && vars.PREMIUM_ENABLED == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: tech-jobz
        run: python -m scripts.newsletter --tier free

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/manifest.json data/analytics.json data/history.json data/seen_ids.json data/*.json.gz _site/data/

      - name: Pages SEO (offres, segments, sitemap)
        run: python -m scripts.seo --data data --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
